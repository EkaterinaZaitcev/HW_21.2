<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/src/css/bootstrap.min.css">
    <title>Shop</title>
    <style>
        .sidebar {
            background-color: #212528;
            padding: 15px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .block {
            background-color: #white;
            padding-left: 90px;
            position: absolute;
            top: 0px;
            left: 170px;
            margin: 0px;
            }
    </style>
</head>
<body>
<div class="text-center col-2 sidebar">
    <div class="col-2 text-bg-dark ps-3">
        <nav class="navbar navbar-dark bg-dark align-items-start" style="Height: 100%">
            <a class="navbar-brand" href="#">
                <img src="/src/bootstrap-logo.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    Меню
            </a>
                <ul><hr class="navbar-nav me-auto mb-2 mb-lg-0 flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Категория</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Заказы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Контакты</a>
                    </li>
                </ul>
                <ul class="dropdown open">
                    <li class="nav-item navbar fixed-bottom ">
                        <a class="nav-link dropdown-toggle " href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">

                        </a>

                        </ul>
                    </li>
                </ul>
            </div>
        </nav>

                <h1 class="text-center">Главная</h1>
                <p class="text-center">Вы находитесь на сайте, для продажи товаров</p>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-4">
                <div class="card position-sticky mr-auto rounded" style="width: 18rem;">
                    <div class="card-header text-center">Товар 1</div>
                    <div class="card" style="width: 18rem;">
                        <div class="card-body center">
                            <h5 class="card-title text-center">$ 100</h5>
                            <p class="card-text">Описание товара 1.</p>
                            <a href="#" class="btn btn-primary w-90">Купить</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-4">
                <div class="card position-sticky rounded" style="width: 18rem;">
                    <div class="card-header text-center">Товар 2</div>
                    <div class="card" style="width: 18rem;">
                        <div class="card-body">
                            <h5 class="card-title text-center">$ 100</h5>
                            <p class="card-text">Описание товара 2.</p>
                            <a href="#" class="btn btn-primary w-90">Купить</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-4">
                <div class="card position-sticky ml-auto rounded" style="width: 18rem;">
                    <div class="card-header text-center">Товар 3</div>
                    <div class="card" style="width: 18rem;">
                        <div class="card-body">
                            <h5 class="card-title text-center">$ 100</h5>
                            <p class="card-text">Описание товара 3.</p>
                            <a href="#" class="btn btn-primary w-90">Купить</a>
